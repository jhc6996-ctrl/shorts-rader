<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MORI RADAR · 릴스·쇼츠 아웃라이어 대시보드</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --surface-soft: #f1f0ec;
      --text: #18181b;
      --muted: #6b7280;
      --border: #e5e4df;
      --accent: #18181b;
      --accent-soft: #eef2ff;
      --insta: #e1306c;
      --youtube: #dc2626;
      --ok-bg: #ecfdf5;
      --ok-text: #047857;
      --warn-bg: #fffbeb;
      --warn-text: #b45309;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-tag {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .updated {
      font-size: 13px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
    }

    /* Main Category Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      max-width: 260px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Filter Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .search-box {
      margin-left: auto;
      min-width: 210px;
      flex: 1;
      max-width: 280px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      background: var(--bg);
      outline: none;
    }

    /* Summary Strip */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
    }

    .stat-val {
      font-size: 20px;
      font-weight: 800;
      margin-top: 2px;
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .badge.insta { background: #fdf2f8; color: var(--insta); }
    .badge.youtube { background: #fef2f2; color: var(--youtube); }
    .badge.outlier { background: #18181b; color: #fff; }
    .badge.solo-ok { background: var(--ok-bg); color: var(--ok-text); }
    .badge.solo-edit { background: var(--warn-bg); color: var(--warn-text); }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hook-box {
      background: var(--surface-soft);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .hook-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .close-btn {
      border: none;
      background: var(--surface-soft);
      width: 32px;
      height: 32px;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
    }

    .script-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      white-space: pre-line;
      font-size: 14px;
      line-height: 1.65;
      margin-bottom: 12px;
    }

    .tip-box {
      background: #f0f9ff;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #0369a1;
    }

    @media (max-width: 640px) {
      .summary { grid-template-columns: 1fr 1fr 1fr; }
      .stat-val { font-size: 17px; }
      .search-box { max-width: 100%; min-width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="brand-tag">MORI · MUSE RADAR</span>
        <h1>릴스 · 쇼츠 대박 영상 수집판</h1>

    <div class="grid" id="cardGrid"></div>

  <div class="modal-backdrop" id="modalBackdrop">

      <div class="script-block" id="modalScript"></div>
      <div class="tip-box" id="modalTip"></div>
    </div>
  </div>

        original: "6개월 아기 통잠 깨는 이유, 낮잠 3번에서 2번 넘어가는 시기라 막잠 시간이 너무 늦으면 새벽에 깹니다. 막잠 4시 반 전에 깨워보세요.",
        script: "[0~3초 훅]\n잘 자던 아기가 6개월쯤 갑자기 새벽마다 깨면 다들 이앓이라고 생각하죠?\n\n[4~22초 핵심]\n사실 낮잠 3번에서 2번으로 넘어가는 과도기라 총 수면 시간이 안 맞아서 그래요.\n마지막 낮잠을 5시 이후까지 자면 밤잠 압력이 떨어져서 새벽에 말똥말똥 깨거든요.\n\n[23~35초 마무리]\n막잠 기상 시간만 오후 4시 반 전으로 당겨보세요. 새벽 기상 확 줄어듭니다.",
        tip: "촬영 팁: 아기 얼굴 노출 없이 아기방·침대 배경 5초 클립 위에 음성 더빙 + 자막만 얹으면 됨."
      },
      {
        id: 6,
        category: "parenting",
        platform: "youtube",
        account: "육아템 비교 쇼츠",
        title: "기저귀 유목민 끝낸 밤기저귀 흡수력 실험",
        views: "28.9만",
        followers: "1.9만",
        outlier: 15.2,
        date: "4일 전",
        solo: "ok",
        soloLabel: "혼자 촬영 ⭕ (손만 출연)",
        hook: "0~3초: '아침마다 이불 젖어서 빨래 지옥인 엄마들, 물 300ml 부어봤더니 차이 확실합니다.'",
        url: "https://www.youtube.com/shorts",
        original: "밤기저귀 3종에 똑같이 물 300ml 붓고 휴지로 눌러봤습니다. 흡수 속도랑 샘 방지 밴드 차이가 이만큼 나요.",
        script: "[0~3초 훅]\n밤기저귀 뭘 써도 새서 아침마다 이불 빨래하셨죠?\n\n[4~20초 실험]\n똑같이 파란 물 300ml 부어보고 티슈로 눌렀을 때 묻어남 차이가 이 정도예요.\n겉만 보송한 게 아니라 옆샘 방지 날개 높이가 달라야 뒤집어 자도 안 새요.\n\n[21~30초 마무리]\n자세한 비교 브랜드는 댓글이나 고정글 확인해 주세요!",
        tip: "촬영 팁: 얼굴 안 나오고 식탁 위에서 물 붓는 손만 찍으면 돼서 스레드/파트너스 전환도 같이 가능."
      }
    ];

    let state = {
      category: "beauty",
      platform: "all",
      soloOnly: false,
      query: ""
    };

    const grid = document.getElementById("cardGrid");
    const modal = document.getElementById("modalBackdrop");

    function render() {
      const filtered = ITEMS.filter(item => {
        if (item.category !== state.category) return false;
        if (state.platform !== "all" && item.platform !== state.platform) return false;
        if (state.soloOnly && item.solo !== "ok") return false;
        if (state.query) {
          const q = state.query.toLowerCase();
          const text = (item.title + " " + item.hook + " " + item.account).toLowerCase();
          if (!text.includes(q)) return false;
        }
        return true;
      });

      document.getElementById("statTotal").textContent = filtered.length + "건";
      document.getElementById("statSolo").textContent = filtered.filter(i => i.solo === "ok").length + "건";
      const maxOutlier = filtered.length ? Math.max(...filtered.map(i => i.outlier)).toFixed(1) + "배" : "-";
      document.getElementById("statMax").textContent = maxOutlier;

      grid.innerHTML = filtered.map(item => `
        <article class="card">
          <div class="card-top">
            <div class="badge-group">
              <span class="badge ${item.platform}">${item.platform === "insta" ? "인스타 릴스" : "유튜브 쇼츠"}</span>
              <span class="badge outlier">평균 대비 ${item.outlier}배</span>
            </div>
            <span class="badge ${item.solo === "ok" ? "solo-ok" : "solo-edit"}">${item.soloLabel}</span>
          </div>
          <h3 class="card-title">${item.title}</h3>
          <div class="meta">
            <span>조회수 ${item.views}</span>
            <span>팔로워 ${item.followers}</span>
            <span>${item.date}</span>
          </div>
          <div class="hook-box">
            <div class="hook-label">3초 후킹 분석</div>
            <div>${item.hook}</div>
          </div>
          <div class="card-actions">
            <a class="btn" href="${item.url}" target="_blank" rel="noopener">원본 보기</a>
            <button class="btn primary" onclick="openModal(${item.id})">각색 대본 보기</button>
          </div>
        </article>
      `).join("") || `<div style="color:var(--muted); padding:24px;">조건에 맞는 영상이 없어요.</div>`;
    }

    window.openModal = function(id) {
      const item = ITEMS.find(i => i.id === id);
      if (!item) return;
      document.getElementById("modalBadges").innerHTML = `
        <span class="badge ${item.platform}">${item.platform === "insta" ? "인스타 릴스" : "유튜브 쇼츠"}</span>
        <span class="badge outlier">평균 대비 ${item.outlier}배</span>
        <span class="badge ${item.solo === "ok" ? "solo-ok" : "solo-edit"}">${item.soloLabel}</span>
      `;
      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("modalOriginal").textContent = item.original;
      document.getElementById("modalScript").textContent = item.script;
      document.getElementById("modalTip").textContent = item.tip;
      modal.classList.add("open");
    };

    document.getElementById("closeModal").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.category = btn.dataset.cat;
        render();
      });
    });

    document.querySelectorAll(".chip[data-platform]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip[data-platform]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.platform = btn.dataset.platform;
        render();
      });
    });

    document.getElementById("soloToggle").addEventListener("click", (e) => {
      state.soloOnly = !state.soloOnly;
      e.target.classList.toggle("active", state.soloOnly);
      render();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.query = e.target.value.trim();
      render();
    });

    render();
  </script>
</body>
</html>
