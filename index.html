<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MORI RADAR · 릴스·쇼츠 아웃라이어</title>
  <style>
    :root {
      --bg: #f6f6f3;
      --surface: #ffffff;
      --surface-soft: #f1f0eb;
      --text: #18181b;
      --muted: #6b7280;
      --border: #e5e4df;
      --insta: #e1306c;
      --youtube: #dc2626;
      --ok-bg: #ecfdf5;
      --ok-text: #047857;
      --warn-bg: #fffbeb;
      --warn-text: #b45309;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 14px 64px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    h1 {
      margin: 2px 0 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .updated {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 999px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      max-width: 240px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #18181b;
      color: #fff;
      border-color: #18181b;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: #18181b;
      color: #fff;
      border-color: #18181b;
    }

    .search-box {
      margin-left: auto;
      flex: 1;
      min-width: 180px;
      max-width: 260px;
    }

    .search-box input {
      width: 100%;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      background: var(--bg);
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 9:16 Video Frame */
    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 12;
      background: #111;
      overflow: hidden;
    }

    .media-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .media-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      color: #fff;
      background: linear-gradient(160deg, #1f1f24 0%, #312538 100%);
      text-decoration: none;
    }

    .media-placeholder .play-pill {
      align-self: center;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex: 1;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .badge.insta { background: #fdf2f8; color: var(--insta); }
    .badge.youtube { background: #fef2f2; color: var(--youtube); }
    .badge.outlier { background: #18181b; color: #fff; }
    .badge.solo-ok { background: var(--ok-bg); color: var(--ok-text); }
    .badge.solo-edit { background: var(--warn-bg); color: var(--warn-text); }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sec-box {
      background: var(--surface-soft);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .sec-box.adapt {
      background: #f0f7ff;
      border: 1px solid #dbeafe;
    }

    .sec-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .sec-box.adapt .sec-label {
      color: #1d4ed8;
    }

    .sec-text {
      white-space: pre-line;
      font-size: 13px;
      line-height: 1.55;
    }

    .open-link {
      display: block;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      background: #18181b;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      margin-top: auto;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .search-box { max-width: 100%; min-width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand-tag">MORI · MUSE RADAR (최근 7~14일)</div>
        <h1>릴스 · 쇼츠 대박 영상 레이더</h1>
      </div>
      <div class="updated">피부·미용 5만+(3배+) · 육아 15만+(5배+)</div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-cat="beauty">🩺 피부 · 미용 · 다이어트</button>
      <button class="tab-btn" data-cat="parenting">🍼 육아 · 생활</button>
    </div>

    <div class="controls">
      <button class="chip active" data-platform="all">전체</button>
      <button class="chip" data-platform="insta">인스타 릴스</button>
      <button class="chip" data-platform="youtube">유튜브 쇼츠</button>
      <button class="chip" id="soloToggle">혼자 촬영 가능만</button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="키워드·후킹 검색..." />
      </div>
    </div>
    <div style="font-size:12px; color:var(--muted); margin:-6px 0 14px 4px;">
      ※ 현재는 레이아웃 예시 상태예요. 오늘 뮤즈(CMD-11) 수집이 들어오면 최근 7~14일 실제 터진 영상 + 썸네일로 교체됩니다.
    </div>

    <div class="grid" id="cardGrid"></div>
  </div>

  <script>
    // youtubeId가 있으면 페이지 안에서 바로 영상 재생, 인스타 릴스는 공식 임베드/바로 열기 카드
    const ITEMS = [
      {
        id: 1,
        category: "beauty",
        platform: "insta",
        account: "@dr.moonjieun",
        title: "필러 녹이면 몸도 같이 녹는 이유 (레퍼런스 샘플)",
        views: "공유 1만+",
        followers: "피부과 원장",
        outlier: 12.0,
        date: "최근 샘플",
        solo: "ok",
        soloLabel: "혼자 촬영 ⭕ (정면 토크)",
        url: "https://www.instagram.com/dr.moonjieun/",
        hook: "필러 녹이면 몸도 같이 녹는 이유 — '필러라는 게 히알루론산이라는 건데'",
        original: "필러라는 게 히알루론산이라는 건데, 녹이는 주사를 맞으면 내 살까지 녹는다고 걱정하시죠? 실제로 녹이는 성분은 히알루론산만 분해하는 효소라 내 피부 조직을 녹이진 않아요. 다만 과하게 들어갔던 볼륨이 빠지면서 원래 처졌던 피부가 드러나 보일 뿐입니다.",
        adapt: "[0~3초 후킹]\n필러 녹이면 내 살도 같이 녹는다고 걱정하시죠?\n결론부터 말하면 살이 녹는 건 절대 아닙니다.\n\n[4~20초 본문]\n녹이는 주사는 히알루론산만 골라서 분해하는 효소예요.\n그런데도 '얼굴이 더 푹 꺼졌다'고 느끼는 이유는, 그동안 필러가 버티고 있던 자리가 빠지면서 원래 탄력 떨어졌던 피부가 그대로 보이기 때문이에요.\n\n[21~32초 마무리]\n그래서 녹인 뒤에는 바로 다시 채우기보다, 피부 탄력부터 채워놓아야 모양이 예쁘게 잡힙니다."
      },
      {
        id: 2,
        category: "beauty",
        platform: "youtube",
        account: "피부/리프팅 쇼츠",
        title: "써마지 vs 포텐자 돈 아끼는 선택 기준 1가지",
        views: "31.5만",
        followers: "2.1만",
        outlier: 15.0,
        date: "3일 전",
        solo: "ok",
        soloLabel: "혼자 촬영 ⭕ (정면 비교)",
        youtubeId: "",
        url: "https://www.youtube.com/shorts",
        hook: "비싼 리프팅 100만 원 넘게 내고 효과 못 본 분들 특징이 딱 하나 있어요.",
        original: "써마지 포텐자 뭐가 더 좋냐고 많이 물어보시는데, 얼굴 살 없는 분이 잘못 받으면 볼 패임 옵니다. 탄력인지 모공인지만 구분해서 고르세요.",
        adapt: "[0~3초 후킹]\n비싼 리프팅 받고도 '나는 왜 효과 없지?' 하시는 분들, 원인이 딱 하나예요.\n\n[4~20초 본문]\n피부가 얇고 탄력이 빠진 얼굴에 탄력 장비랑 지방 빼는 장비를 거꾸로 넣은 경우예요.\n얼굴 살이 없는데 볼살 꺼지는 쪽을 건드리면 오히려 퀭해 보이고요.\n반대로 모공·홍조가 고민이면 고주파 니들 쪽이 훨씬 가성비 좋습니다.\n\n[21~30초 마무리]\n'요즘 유행하는 기계' 말고 내 피부 두께부터 보고 고르셔야 돈 안 버려요."
      },
      {
        id: 3,
        category: "parenting",
        platform: "insta",
        account: "6개월 육아 릴스",
        title: "6개월 아기 밤잠 통잠 끊기는 진짜 이유 1가지",
        views: "41.2만",
        followers: "3.1만",
        outlier: 13.3,
        date: "2일 전",
        solo: "ok",
        soloLabel: "혼자 촬영 ⭕ (배경+자막)",
        url: "https://www.instagram.com/",
        hook: "잘 자던 아기가 6개월 되자마자 새벽 2시에 깨기 시작했다면 이앓이 말고 이것부터 보세요.",
        original: "6개월 아기 통잠 깨는 이유, 낮잠 3번에서 2번 넘어가는 시기라 막잠 시간이 너무 늦으면 새벽에 깹니다. 막잠 4시 반 전에 깨워보세요.",
        adapt: "[0~3초 후킹]\n잘 자던 아기가 6개월쯤 갑자기 새벽마다 깨면 다들 이앓이라고 생각하죠?\n\n[4~20초 본문]\n사실 낮잠 3번에서 2번으로 넘어가는 과도기라 총 수면 시간이 안 맞아서 그래요.\n마지막 낮잠을 5시 이후까지 자면 밤잠 압력이 떨어져서 새벽에 말똥말똥 깨거든요.\n\n[21~30초 마무리]\n막잠 기상 시간만 오후 4시 반 전으로 당겨보세요. 새벽 기상 확 줄어듭니다."
      }
    ];

    let state = { category: "beauty", platform: "all", soloOnly: false, query: "" };
    const grid = document.getElementById("cardGrid");

    function renderMedia(item) {
      const thumb = item.thumbnail || (item.youtubeId ? `https://i.ytimg.com/vi/${item.youtubeId}/hqdefault.jpg` : "");
      if (item.platform === "youtube" && item.youtubeId) {
        return `
          <div class="media-box" onclick="this.innerHTML='<iframe src=\\'https://www.youtube.com/embed/${item.youtubeId}?autoplay=1\\' allowfullscreen></iframe>'" style="cursor:pointer;">
            <img src="${thumb}" alt="${item.title}" style="width:100%; height:100%; object-fit:cover; display:block;" />
            <div style="position:absolute; inset:0; background:rgba(0,0,0,0.28); display:flex; align-items:center; justify-content:center;">
              <div class="play-pill">▶ 쇼츠 바로 재생</div>
            </div>
          </div>
        `;
      }
      if (thumb) {
        return `
          <div class="media-box">
            <a href="${item.url}" target="_blank" rel="noopener" style="display:block; width:100%; height:100%; position:relative;">
              <img src="${thumb}" alt="${item.title}" style="width:100%; height:100%; object-fit:cover; display:block;" />
              <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.65), transparent 55%); display:flex; align-items:flex-end; justify-content:center; padding:14px;">
                <div class="play-pill">▶ 원본 영상 바로 보기</div>
              </div>
            </a>
          </div>
        `;
      }
      return `
        <div class="media-box">
          <a class="media-placeholder" href="${item.url}" target="_blank" rel="noopener">
            <div style="font-size:12px; opacity:0.85;">${item.account} · ${item.date}</div>
            <div class="play-pill">▶ 원본 영상 바로 보기</div>
            <div style="font-size:13px; font-weight:700;">"${item.hook}"</div>
          </a>
        </div>
      `;
    }

    function render() {
      const filtered = ITEMS.filter(item => {
        if (item.category !== state.category) return false;
        if (state.platform !== "all" && item.platform !== state.platform) return false;
        if (state.soloOnly && item.solo !== "ok") return false;
        if (state.query) {
          const q = state.query.toLowerCase();
          if (!(item.title + " " + item.hook + " " + item.original + " " + item.adapt).toLowerCase().includes(q)) return false;
        }
        return true;
      });

      grid.innerHTML = filtered.map(item => `
        <article class="card">
          ${renderMedia(item)}
          <div class="card-body">
            <div class="badge-row">
              <span class="badge ${item.platform}">${item.platform === "insta" ? "인스타 릴스" : "유튜브 쇼츠"}</span>
              <span class="badge outlier">평균 대비 ${item.outlier}배</span>
              <span class="badge ${item.solo === "ok" ? "solo-ok" : "solo-edit"}">${item.soloLabel}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <div class="meta">
              <span>${item.account}</span>
              <span>조회수 ${item.views}</span>
              <span>팔로워 ${item.followers}</span>
            </div>

            <div class="sec-box">
              <div class="sec-label">⚡ 후킹멘트 (0~3초)</div>
              <div class="sec-text">${item.hook}</div>
            </div>

            <div class="sec-box">
              <div class="sec-label">📝 원본 대본</div>
              <div class="sec-text">${item.original}</div>
            </div>

            <div class="sec-box adapt">
              <div class="sec-label">🎬 아주 비슷하게 각색 (희주 님 버전)</div>
              <div class="sec-text">${item.adapt}</div>
            </div>

            <a class="open-link" href="${item.url}" target="_blank" rel="noopener">원본 릴스/쇼츠 열기 ↗</a>
          </div>
        </article>
      `).join("") || `<div style="color:var(--muted); padding:24px;">조건에 맞는 영상이 없어요.</div>`;
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.category = btn.dataset.cat;
        render();
      });
    });

    document.querySelectorAll(".chip[data-platform]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip[data-platform]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.platform = btn.dataset.platform;
        render();
      });
    });

    document.getElementById("soloToggle").addEventListener("click", (e) => {
      state.soloOnly = !state.soloOnly;
      e.target.classList.toggle("active", state.soloOnly);
      render();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.query = e.target.value.trim();
      render();
    });

    render();
  </script>
</body>
</html>
