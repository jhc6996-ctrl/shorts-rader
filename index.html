<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MORI RADAR · 릴스·쇼츠 아웃라이어</title>
  <style>
    :root {
      --bg: #f6f6f3;
      --surface: #ffffff;
      --surface-soft: #f1f0eb;
      --text: #18181b;
      --muted: #6b7280;
      --border: #e5e4df;
      --insta: #e1306c;
      --youtube: #dc2626;
      --ok-bg: #ecfdf5;
      --ok-text: #047857;
      --warn-bg: #fffbeb;
      --warn-text: #b45309;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 14px 64px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    h1 {
      margin: 2px 0 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .updated {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 999px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      max-width: 240px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #18181b;
      color: #fff;
      border-color: #18181b;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: #18181b;
      color: #fff;
      border-color: #18181b;
    }

    .search-box {
      margin-left: auto;
      flex: 1;
      min-width: 180px;
      max-width: 260px;
    }

    .search-box input {
      width: 100%;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      background: var(--bg);
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 9:16 Video Frame */
    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 12;
      background: #111;
      overflow: hidden;
    }

    .media-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .media-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      color: #fff;
      background: linear-gradient(160deg, #1f1f24 0%, #312538 100%);
      text-decoration: none;
    }

    .media-placeholder .play-pill {
      align-self: center;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex: 1;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .badge.insta { background: #fdf2f8; color: var(--insta); }
    .badge.youtube { background: #fef2f2; color: var(--youtube); }
    .badge.outlier { background: #18181b; color: #fff; }
    .badge.solo-ok { background: var(--ok-bg); color: var(--ok-text); }
    .badge.solo-edit { background: var(--warn-bg); color: var(--warn-text); }
    .badge.muted { background: var(--surface-soft); color: var(--muted); }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sec-box {
      background: var(--surface-soft);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .sec-box.adapt {
      background: #f0f7ff;
      border: 1px solid #dbeafe;
    }

    .sec-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .sec-box.adapt .sec-label {
      color: #1d4ed8;
    }

    .sec-text {
      white-space: pre-line;
      font-size: 13px;
      line-height: 1.55;
    }

    .open-link {
      display: block;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      background: #18181b;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      margin-top: auto;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .search-box { max-width: 100%; min-width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand-tag">MORI · MUSE RADAR (최근 7~14일)</div>
        <h1>릴스 · 쇼츠 대박 영상 레이더</h1>
      </div>
      <div class="updated">피부·미용 5만+(3배+) · 육아 15만+(5배+)</div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-cat="beauty">🩺 피부 · 미용 · 다이어트</button>
      <button class="tab-btn" data-cat="parenting">🍼 육아 · 생활</button>
    </div>

    <div class="controls">
      <button class="chip active" data-platform="all">전체</button>
      <button class="chip" data-platform="insta">인스타 릴스</button>
      <button class="chip" data-platform="youtube">유튜브 쇼츠</button>
      <button class="chip" id="soloToggle">혼자 촬영 가능만</button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="키워드·후킹 검색..." />
      </div>
    </div>
    <div style="font-size:12px; color:var(--muted); margin:-6px 0 14px 4px;">
      2026-11-25 기준 · 피부과 의사·미용 원장님 릴스·쇼츠만 새로 수집 중이에요.
    </div>

    <div class="grid" id="cardGrid"></div>
  </div>

  <script>
    // youtubeId가 있으면 페이지 안에서 바로 영상 재생, 인스타 릴스는 공식 임베드로 재생 (실패 시 아래 '원본 열기' 링크)
    const ITEMS = [];
    let state = { category: "beauty", platform: "all", soloOnly: false, query: "" };
    const grid = document.getElementById("cardGrid");

    // 클릭하면 그 자리에서 원본 영상 재생 (유튜브 임베드 · 인스타 릴스 임베드)
    function playEmbed(el, src) {
      el.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture; clipboard-write" allowfullscreen scrolling="no"></iframe>`;
    }

    function renderMedia(item) {
      if (item.platform === "youtube" && item.youtubeId) {
        const thumb = item.thumbnail || `https://i.ytimg.com/vi/${item.youtubeId}/hqdefault.jpg`;
        return `
          <div class="media-box" onclick="playEmbed(this, 'https://www.youtube.com/embed/${item.youtubeId}?autoplay=1')" style="cursor:pointer;">
            <img src="${thumb}" alt="${item.title}" style="width:100%; height:100%; object-fit:cover; display:block;" />
            <div style="position:absolute; inset:0; background:rgba(0,0,0,0.28); display:flex; align-items:center; justify-content:center;">
              <div class="play-pill">▶ 쇼츠 바로 재생</div>
            </div>
          </div>
        `;
      }
      if (item.platform === "insta" && item.instaEmbed) {
        return `
          <div class="media-box" onclick="playEmbed(this, '${item.instaEmbed}')" style="cursor:pointer;">
            <div class="media-placeholder" style="justify-content:space-between;">
              <div style="font-size:12px; opacity:0.85;">${item.account} · ${item.date}</div>
              <div class="play-pill">▶ 릴스 바로 재생</div>
              <div style="font-size:13px; font-weight:700;">${item.hook}</div>
            </div>
          </div>
        `;
      }
      if (item.thumbnail) {
        return `
          <div class="media-box">
            <a href="${item.url}" target="_blank" rel="noopener" style="display:block; width:100%; height:100%; position:relative;">
              <img src="${item.thumbnail}" alt="${item.title}" style="width:100%; height:100%; object-fit:cover; display:block;" />
              <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.65), transparent 55%); display:flex; align-items:flex-end; justify-content:center; padding:14px;">
                <div class="play-pill">▶ 원본 영상 바로 보기</div>
              </div>
            </a>
          </div>
        `;
      }
      return `
        <div class="media-box">
          <a class="media-placeholder" href="${item.url}" target="_blank" rel="noopener">
            <div style="font-size:12px; opacity:0.85;">${item.account} · ${item.date}</div>
            <div class="play-pill">▶ 원본 영상 바로 보기</div>
            <div style="font-size:13px; font-weight:700;">"${item.hook}"</div>
          </a>
        </div>
      `;
    }

    function render() {
      const filtered = ITEMS.filter(item => {
        if (item.category !== state.category) return false;
        if (state.platform !== "all" && item.platform !== state.platform) return false;
        if (state.soloOnly && item.solo !== "ok") return false;
        if (state.query) {
          const q = state.query.toLowerCase();
          if (!(item.title + " " + item.hook + " " + item.original + " " + item.adapt).toLowerCase().includes(q)) return false;
        }
        return true;
      });

      grid.innerHTML = filtered.map(item => `
        <article class="card">
          ${renderMedia(item)}
          <div class="card-body">
            <div class="badge-row">
              <span class="badge ${item.platform}">${item.platform === "insta" ? "인스타 릴스" : "유튜브 쇼츠"}</span>
              ${item.badge ? `<span class="badge ${item.badgeKind || "outlier"}">${item.badge}</span>` : ""}
              <span class="badge ${item.solo === "ok" ? "solo-ok" : "solo-edit"}">${item.soloLabel}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <div class="meta">
              <span>${item.account}</span>
              <span>${item.views}</span>
              ${item.followers ? `<span>${item.followers}</span>` : ""}
              <span>${item.date}</span>
            </div>

            <div class="sec-box">
              <div class="sec-label">⚡ 후킹멘트 (0~3초)</div>
              <div class="sec-text">${item.hook}</div>
            </div>

            <div class="sec-box">
              <div class="sec-label">📝 원본 대본</div>
              <div class="sec-text">${item.original}</div>
            </div>

            <div class="sec-box adapt">
              <div class="sec-label">🎬 아주 비슷하게 각색 (희주 님 버전)</div>
              <div class="sec-text">${item.adapt}</div>
            </div>

            <a class="open-link" href="${item.url}" target="_blank" rel="noopener">원본 릴스/쇼츠 열기 ↗</a>
          </div>
        </article>
      `).join("") || `<div style="color:var(--muted); padding:24px;">아직 조건에 맞는 원장님 영상이 올라오기 전이에요.</div>`;
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.category = btn.dataset.cat;
        render();
      });
    });

    document.querySelectorAll(".chip[data-platform]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip[data-platform]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.platform = btn.dataset.platform;
        render();
      });
    });

    document.getElementById("soloToggle").addEventListener("click", (e) => {
      state.soloOnly = !state.soloOnly;
      e.target.classList.toggle("active", state.soloOnly);
      render();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.query = e.target.value.trim();
      render();
    });

    render();
  </script>
</body>
</html>
